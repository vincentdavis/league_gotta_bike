<!DOCTYPE html>
<html lang="en" data-theme="lemonade">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 Server Error</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f3f4f6; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { text-align: center; padding: 2rem; }
        h1 { font-size: 6rem; font-weight: bold; color: #ef4444; margin: 0; }
        h2 { font-size: 1.5rem; color: #111827; margin: 1rem 0; }
        p { color: #6b7280; max-width: 28rem; margin: 0 auto 2rem; }
        a { display: inline-block; padding: 0.75rem 1.5rem; background: #2563eb; color: white; text-decoration: none; border-radius: 0.5rem; font-weight: 600; }
        a:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>500</h1>
        <h2>Something Went Wrong</h2>
        <p>We're experiencing a server error. Please try again later. If the problem persists, contact the site administrator.</p>
        <a href="/">Go Home</a>
    </div>
</body>
</html>
