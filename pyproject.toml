[project]
name = "league-gotta-bike"
version = "0.1.0"
description = "App for managing bike leagues and teams"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.54",
    "channels[daphne]>=4.3.2",
    "dj-database-url>=3.1.2",
    "django>=6.0.7",
    "django-allauth[mfa]>=65.18.0",
    "django-anymail[resend]>=15.0",
    "apscheduler>=3.11.3",
    "django-htmx>=1.28.0",
    "django-ninja>=1.6.2",
    "django-phonenumber-field>=8.5.0",
    "django-push-notifications[wp]>=3.3.0",
    "django-storages[s3]>=1.14.6",
    "django-tailwind[reload, honcho]>=4.5.0",
    "django-tasks>=0.12.0",
    "logfire[asgi,django,psycopg,sqlite3]>=4.38.0",
    "phonenumbers>=9.0.34",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "resend>=2.34.0",
    "whitenoise>=6.12.0",
    "sinch>=2.1.0",
    "django-tasks-db>=0.12.0",
    "django-constance>=4.3.5",
]

[dependency-groups]
dev = [
    "django-tailwind[cookiecutter,honcho,reload]",
    "django-browser-reload>=1.21.0",
    "django-debug-toolbar>=7.0.0",
    "django-reset-migrations>=0.4.0",
    "django-stubs>=6.0.7",
    "pytest>=9.1.1",
    "cookiecutter>=2.7.1", # needed for tailwind app
    "ruff>=0.15.22",
    "ty>=0.0.63",
    "honcho>=2.0.0",
    "logfire-mcp>=0.9.0",
]
